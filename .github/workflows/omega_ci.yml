name: JARVIS Omega CI Gatekeeper

on:
  push:
    branches: [ main, core/**, feature/**, production/**, evolution/** ]
  pull_request:
    branches: [ main, core/**, production/**, evolution/** ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Enforcement: Bit-for-Bit Determinism"
        run: |
          cd compiler && cargo build --release
          sha256sum target/release/jarvis-compiler > hash1.txt
          cargo clean
          cargo build --release
          sha256sum target/release/jarvis-compiler > hash2.txt
          diff hash1.txt hash2.txt || (echo "ERROR: Build is not deterministic." && exit 1)

      - name: "Enforcement: PDD & EFDD Static Verification"
        run: |
          cd compiler && cargo run -- ../voice.jrv
          
      - name: "Enforcement: Zero Sugar Regularity (Rev 6.0)"
        run: |
          python3 tools/zero_sugar_lint.py brain.jrv
          python3 tools/zero_sugar_lint.py quantum.jrv
          python3 tools/zero_sugar_lint.py swarm.jrv

      - name: "Autonomous Repair: Fix Plan Generation"
        if: failure()
        run: |
          echo "Verification Failed. Generating Autonomous Fix Plan via NCI..."
          # Simulating NCI tool call to get_fix_plan
          cd compiler && cargo run -- --mcp <<EOF
          {"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_fix_plan","arguments":{"violation_type":"CI_FAILURE","context":"Check mcp.log"}}}
          EOF
          mv mcp.log fix_plan.json

      - name: "Artifact: Upload Fix Plan"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-fix-plan
          path: compiler/fix_plan.json

      - name: "Scientific Dashboard Injection"
        run: |
          python3 tools/jarvis-verify.py > dashboard.txt
          # In production, this would use sed to inject into README.md
          cat dashboard.txt
