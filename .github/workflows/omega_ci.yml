name: JARVIS Sovereign CI Gatekeeper

on:
  push:
    branches: [ main ]

permissions:
  contents: write # Required for Bot Injection

jobs:
  sovereign-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Bootstrap: Native .jrv Compilation"
        run: |
          # Use ONLY the native bootstrap chain.
          # No cargo commands allowed.
          ./compiler/jrvc compiler/*.jrv substrate/*.jrv core/*.jrv --bootstrap

      - name: "Enforcement: eTDD & PDD Verification"
        run: |
          ./compiler/jrvc scifi_verification.jrv --strict-verify > test_report.log

      - name: "Native Dashboard Generation"
        run: |
          # A pure JARVIS script generates the markdown dashboard
          ./compiler/jrvc tools/generate_dashboard.jrv --run > dashboard.md

      - name: "Active Gatekeeping: README Injection & Commit"
        run: |
          # Extract the dashboard section and replace it in the README
          sed -i '/## 📊 Scientific Dashboard/,$d' README.md
          cat dashboard.md >> README.md
          
          # Native Bot Commit
          git config --global user.name "JARVIS Sovereign Bot"
          git config --global user.email "bot@project-jarvis.local"
          git add README.md
          # Commit only if changes exist
          git diff --quiet && git diff --staged --quiet || git commit -m "docs(dashboard): autonomous scientific update [skip ci]"
          git push origin main
