name: 🧪 Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check 2>&1 || echo "⚠ Format check failed (non-blocking)"

      - name: Clippy lint
        run: cargo clippy --workspace -- -D warnings 2>&1 || echo "⚠ Clippy warnings found (non-blocking)"

      - name: Check for TODO/FIXME/HACK markers
        run: |
          echo "Checking for leftover development markers..."
          FOUND=$(grep -rn "TODO\|FIXME\|HACK\|XXX\|BUG" --include='*.rs' --include='*.jrv' --include='*.md' . \
            --exclude-dir=target --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null | grep -v ".fingerprint" | grep -v "Cargo.lock" || true)
          if [ -n "$FOUND" ]; then
            echo "⚠ Found TODO/FIXME/HACK markers:"
            echo "$FOUND" | head -30
            echo "... ($(echo "$FOUND" | wc -l) total)"
          else
            echo "✅ No leftover markers found"
          fi

      - name: Check for debug print/println left in production code
        run: |
          echo "Checking for debug statements in .rs files..."
          FOUND=$(grep -rn "dbg!\|eprintln\|println!" --include='*.rs' compiler/src/ \
            --exclude-dir=target 2>/dev/null | grep -v "test_" | grep -v "// " || true)
          if [ -n "$FOUND" ]; then
            echo "⚠ Debug statements found:"
            echo "$FOUND"
          else
            echo "✅ No debug statements in production code"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit 2>&1 || echo "⚠ cargo-audit install failed (continuing)"

      - name: Run security audit
        run: cargo audit 2>&1 || echo "⚠ Security advisories found (non-blocking)"
        continue-on-error: true

      - name: Check for secrets in commit history
        run: |
          echo "Scanning for potential secrets in code..."
          git log --all -p 2>/dev/null | grep -n "api_key\|password\|secret\|token\|-----BEGIN" \
            --include='*.rs' --include='*.jrv' --include='*.json' \
            | grep -v "test_" | grep -v "github_pat_" | head -10 || echo "✅ No secrets detected"

  coverage:
    name: Code Coverage Map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Count lines of code
        run: |
          echo "### 📊 Codebase Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Files | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          
          for ext in rs jrv md toml json sh c; do
            COUNT=$(find . -name "*.$ext" -not -path './target/*' -not -path './.git/*' -not -path './.gemini/*' 2>/dev/null | wc -l)
            LINES=$(find . -name "*.$ext" -not -path './target/*' -not -path './.git/*' -not -path './.gemini/*' -exec cat {} + 2>/dev/null | wc -l)
            echo "| .$ext | $COUNT | $LINES |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Count tests
        run: |
          RUST_TESTS=$(grep -rn "#\[test\]" --include='*.rs' . --exclude-dir=target 2>/dev/null | wc -l)
          JRV_TESTS=$(grep -rn "test \"" --include='*.jrv' . --exclude-dir=target 2>/dev/null | wc -l)
          echo "Rust tests: $RUST_TESTS" >> $GITHUB_STEP_SUMMARY
          echo "JRV tests: $JRV_TESTS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  stage0-check:
    name: Stage-0 Bootstrap Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build compiler
        run: cargo build -p jarvis-compiler 2>&1

      - name: Verify bootstrap script works with real compiler
        run: |
          echo "Testing Stage-0 bootstrap with real binary..."
          bash tools/jrvc_stage0.sh --bootstrap
          ./target/debug/jarvis-compiler --version
          ./target/debug/jarvis-compiler --full-diagnostics
          echo "✅ Stage-0 bootstrap chain verified"
