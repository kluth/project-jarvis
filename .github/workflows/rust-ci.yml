name: Rust Compiler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build
        run: cargo build 2>&1

      - name: Run tests
        run: cargo test 2>&1

      - name: Test --governor CLI flag
        run: ./target/debug/jarvis-compiler --governor