name: Rust Compiler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build 2>&1

      - name: Run tests
        run: cargo test 2>&1

      - name: Test CLI flags
        run: |
          ../target/debug/jarvis-compiler --version
          ../target/debug/jarvis-compiler --governor
          ../target/debug/jarvis-compiler --full-diagnostics

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ../target/debug/*.d
          retention-days: 7
