name: 🦀 Rust Compiler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
        include:
          - toolchain: nightly
            allow-failure: true
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust ${{ matrix.toolchain }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build workspace (all crates)
        run: cargo build --workspace 2>&1

      - name: Run full test suite
        run: cargo test --workspace 2>&1

      - name: Test CLI flags
        run: |
          ./target/debug/jarvis-compiler --version
          ./target/debug/jarvis-compiler --governor
          ./target/debug/jarvis-compiler --full-diagnostics

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.toolchain }}
          path: target/debug/*.d
          retention-days: 7

      - name: Allow nightly failures
        if: ${{ matrix.allow-failure }}
        continue-on-error: true
