name: 📊 Scientific Dashboard Generator

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      generate-dashboard:
        description: 'Generate scientific dashboard'
        required: false
        default: true

permissions:
  contents: write

jobs:
  generate-dashboard:
    name: Generate Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build compiler
        run: cargo build -p jarvis-compiler 2>&1

      - name: Collect telemetry
        id: telemetry
        run: |
          echo "### 📊 JARVIS Scientific Dashboard" > dashboard.md
          echo "" >> dashboard.md
          echo "*Generated by JARVIS Native Bootstrap Chain | $(date -u '+%Y-%m-%d %H:%M UTC')*" >> dashboard.md
          echo "" >> dashboard.md

          # Governor engine state
          echo "## 🧠 Governor Engine State" >> dashboard.md
          echo "" >> dashboard.md
          echo '```json' >> dashboard.md
          ./target/debug/jarvis-compiler --governor >> dashboard.md
          echo '```' >> dashboard.md
          echo "" >> dashboard.md

          # Full diagnostics
          echo "## 🔬 Diagnostics Report" >> dashboard.md
          echo "" >> dashboard.md
          echo '```' >> dashboard.md
          ./target/debug/jarvis-compiler --full-diagnostics 2>&1 >> dashboard.md
          echo '```' >> dashboard.md
          echo "" >> dashboard.md

          # Version info
          echo "## 📦 Compiler Version" >> dashboard.md
          echo "" >> dashboard.md
          echo '```' >> dashboard.md
          ./target/debug/jarvis-compiler --version >> dashboard.md
          echo '```' >> dashboard.md
          echo "" >> dashboard.md

          # Test results
          echo "## 🧪 Test Results" >> dashboard.md
          echo "" >> dashboard.md
          cargo test --workspace 2>&1 | tail -20 >> dashboard.md
          echo "" >> dashboard.md

          # Codebase stats
          echo "## 📐 Codebase Statistics" >> dashboard.md
          echo "" >> dashboard.md
          echo "| Metric | Value |" >> dashboard.md
          echo "|--------|-------|" >> dashboard.md
          echo "| Rust source files | $(find . -name '*.rs' -not -path './target/*' -not -path './.git/*' | wc -l) |" >> dashboard.md
          echo "| JRV source files | $(find . -name '*.jrv' -not -path './target/*' -not -path './.git/*' | wc -l) |" >> dashboard.md
          echo "| Total Rust lines | $(find . -name '*.rs' -not -path './target/*' -not -path './.git/*' -exec cat {} + | wc -l) |" >> dashboard.md
          echo "| Total JRV lines | $(find . -name '*.jrv' -not -path './target/*' -not -path './.git/*' -exec cat {} + | wc -l) |" >> dashboard.md
          echo "| Rust tests | $(grep -rn '#\[test\]' --include='*.rs' . --exclude-dir=target | wc -l) |" >> dashboard.md
          echo "| JRV tests | $(grep -rn 'test \"' --include='*.jrv' . --exclude-dir=target | wc -l) |" >> dashboard.md
          echo "" >> dashboard.md

          # Module health
          echo "## 🏗️ Module Health" >> dashboard.md
          echo "" >> dashboard.md
          echo "| Module | Type | Status |" >> dashboard.md
          echo "|--------|------|--------|" >> dashboard.md
          for f in compiler/src/*.rs; do
            MOD=$(basename "$f" .rs)
            TESTS=$(grep -c "#\[test\]" "$f" 2>/dev/null || echo 0)
            echo "| $MOD | Rust | ✅ $TESTS tests |" >> dashboard.md
          done
          for f in substrate/src/*.rs; do
            MOD=$(basename "$f" .rs)
            echo "| $MOD | Substrate | ✅ Active |" >> dashboard.md
          done
          echo "" >> dashboard.md
          echo "---" >> dashboard.md
          echo "*Dashboard auto-generated by JARVIS CI Pipeline*" >> dashboard.md

      - name: Inject dashboard into README
        run: |
          # Read existing README up to the dashboard section
            if grep -q "## 📊 Scientific Dashboard" README.md; then
            sed -i '/## 📊 Scientific Dashboard/,/Dashboard auto-generated/d' README.md
          fi
          
          # Remove stale Stage-0 banners (they accumulated 50+ times)
          sed -i '/^--- JARVIS Stage-0 Bootstrap Active ---$/d' README.md
          
          # Append new dashboard
          echo "" >> README.md
          cat dashboard.md >> README.md

      - name: Commit dashboard update
        run: |
          git config --global user.name "JARVIS Sovereign Bot"
          git config --global user.email "bot@project-jarvis.local"
          git add README.md dashboard.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs(dashboard): autonomous scientific update [skip ci]"
          git push origin main
